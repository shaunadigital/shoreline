<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Shoreline</title>
  <meta name="description" content="Drive a little off-roader around a tropical island. Knock things over, find shells, bowl a strike." />
  <meta name="theme-color" content="#ff7a59" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Shrikhand&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="scene"></canvas>

  <section id="intro" class="loading">
    <div class="loader">
      <img class="logo" src="./logo.webp" alt="Shoreline" width="900" height="289" />
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="52" />
        <circle id="load-ring" class="fill" cx="60" cy="60" r="52" />
      </svg>
      <p id="load-pct" class="pct" aria-live="polite">0%</p>
      <p class="kicker">a tiny island to drive around</p>
    </div>
    <div class="ready-ui">
      <img class="logo" src="./logo.webp" alt="Shoreline" width="900" height="289" />
      <div class="foot">
        <button id="play" disabled>Start</button>
        <p class="keys"><kbd>WASD</kbd> drive · <kbd>Space</kbd> jump · <kbd>B</kbd> drift · <kbd>Shift</kbd> boost · <kbd>R</kbd> respawn · <kbd>M</kbd> mute · drag to look around</p>
        <a class="more" href="https://games.shauna.digital/">More games</a>
      </div>
    </div>
  </section>

  <div id="hud">
    <div class="brand"><img src="./logo.webp" alt="Shoreline" width="900" height="289" /></div>
    <div class="stats">
      <div class="stat" data-stat="bowling"><b>🎳 Bowling</b><span class="v">0/10</span><span class="s"></span></div>
      <div class="stat" data-stat="shells"><b>🐚 Shells</b><span class="v">0/8</span><span class="s"></span></div>
    </div>
    <div class="dash"><span id="speed">0</span><small>km/h</small></div>
    <div class="actions">
      <button id="sound" aria-label="Mute" title="Mute (M)">🔊</button>
      <div class="sound-wrap">
        <button id="volume" aria-label="Volume" aria-expanded="false" title="Volume"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="display:block"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 2v12M8 2v12M13 2v12"/></g><g fill="currentColor"><circle cx="3" cy="10" r="2.2"/><circle cx="8" cy="5" r="2.2"/><circle cx="13" cy="9" r="2.2"/></g></svg></button>
        <div id="sound-panel" hidden>
          <label for="vol-music">Music</label><input id="vol-music" type="range" min="0" max="100" step="1" />
          <label for="vol-sfx">Effects</label><input id="vol-sfx" type="range" min="0" max="100" step="1" />
        </div>
      </div>
      <button id="reset">Respawn<kbd>R</kbd></button>
    </div>
    <div class="touch" aria-hidden="true">
      <div class="pad">
        <button data-touch="left" aria-label="Steer left">◀</button>
        <button data-touch="right" aria-label="Steer right">▶</button>
      </div>
      <div class="pad">
        <button data-touch="jump" aria-label="Jump" class="jump">⤒</button>
        <button data-touch="rev" aria-label="Reverse">▼</button>
        <button data-touch="gas" aria-label="Gas" class="gas">▲</button>
      </div>
    </div>
  </div>

  <div id="race" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"><strong></strong><span></span></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

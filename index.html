<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Shoreline</title>
  <meta name="description" content="Drive a little off-roader around a tropical island. Knock things over, find shells, bowl a strike." />
  <meta name="theme-color" content="#ff7a59" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Shrikhand&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="scene"></canvas>

  <section id="intro">
    <div class="card">
      <p class="kicker">a tiny island to drive around</p>
      <h1>Shoreline</h1>
      <p class="lede">Knock over the letters, hunt for shells on the beach, and bowl a strike with the tiki pins.</p>
      <button id="play" disabled>Loading the island…</button>
      <p class="keys"><kbd>WASD</kbd> or arrows to drive · <kbd>Space</kbd> brake · <kbd>Shift</kbd> boost · <kbd>R</kbd> flip back</p>
    </div>
  </section>

  <div id="hud">
    <div class="brand">Shoreline</div>
    <div class="stats">
      <div class="stat" data-stat="bowling"><b>🎳 Bowling</b><span class="v">0/10</span><span class="s"></span></div>
      <div class="stat" data-stat="shells"><b>🐚 Shells</b><span class="v">0/8</span><span class="s"></span></div>
    </div>
    <div class="dash"><span id="speed">0</span><small>km/h</small></div>
    <div class="actions">
      <button id="reset">Flip back<kbd>R</kbd></button>
    </div>
    <div class="touch">
      <div class="pad">
        <button data-touch="left" aria-label="Steer left">◀</button>
        <button data-touch="right" aria-label="Steer right">▶</button>
      </div>
      <div class="pad">
        <button data-touch="rev" aria-label="Reverse">▼</button>
        <button data-touch="gas" aria-label="Gas" class="gas">▲</button>
      </div>
    </div>
  </div>

  <div id="toast"><strong></strong><span></span></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
